name: Newmark Group
description: >-
  Newmark Group, Inc. (NASDAQ: NMRK) is a global commercial real estate
  advisory and services firm headquartered in New York City. Founded in 1929
  and acquired by BGC Partners in October 2011, Newmark provides capital
  markets, leasing, valuation & advisory, global corporate services (GCS),
  property management, industrial and logistics, multifamily, and retail
  services. The firm expanded its international footprint with the 2023
  acquisition of UK-based Gerald Eve and its multifamily platform via Open
  Realty Advisors. Newmark publishes recurring industry research under the
  MarketBeat / market-report brand but does not operate a public developer
  program or expose machine-readable APIs.
